<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Carico Scarico Bar</title>
<style>
  :root {
    --bg: #0f1222; --card: #1a1f38; --card2: #262d50; --text: #f2f3f8; --muted: #9aa1c3;
    --accent: #5b7cff; --ok: #2ecc8f; --bad: #ff5d6c; --warn: #ffb84d; --line: #2c3459;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { flex: 1; margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; }
  .btn { border: 0; border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 600; background: var(--card2); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn.block { display: block; width: 100%; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; }
  .back { background: none; border: 0; font-size: 26px; line-height: 1; padding: 0 6px 0 0; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
  .kpis > div { background: var(--card2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kpi { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .cat { margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; font-size: 13px; letter-spacing: .06em; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--card); border-radius: 12px;
    margin-bottom: 8px; border: 2px solid transparent; }
  .item.mod { border-color: var(--warn); }
  .item .name { flex: 1; min-width: 0; }
  .item .name b { display: block; font-weight: 600; word-break: break-word; }
  .step { display: flex; align-items: center; gap: 4px; flex: none; }
  .step button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card2); font-size: 22px; font-weight: 700; }
  .step input { width: 64px; padding: 8px 4px; text-align: center; font-size: 18px; font-weight: 700; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .footer .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .footer .inner > .btn { flex: 1; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs .btn { flex: 1; padding: 10px 6px; font-size: 15px; }
  .tab.on { background: var(--accent); color: #fff; }
  label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 14px; }
  input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; font-size: 18px; }
  .chk { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .chk input { width: 20px; height: 20px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--card2); font-size: 12px; white-space: nowrap; }
  .badge.bar { background: var(--accent); color: #fff; text-transform: uppercase; letter-spacing: .05em; }
  .pos { color: var(--ok); } .neg { color: var(--bad); } .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
  .sync { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
  .sync.busy { background: var(--warn); } .sync.off { background: var(--bad); }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; max-width: 90%;
    background: var(--bad); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; }
  .toast.ok { background: var(--ok); color: #04210f; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .menu-card { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; text-align: left; background: var(--card);
    border-radius: 16px; padding: 20px 18px; margin-bottom: 12px; }
  .menu-card .ico { font-size: 32px; }
  .menu-card .t { font-size: 21px; font-weight: 800; }
  .menu-card .freccia { margin-left: auto; font-size: 22px; }
  .avviso { background: rgba(255, 184, 77, .12); border: 1px solid var(--warn); color: var(--warn); border-radius: 12px;
    padding: 8px 12px; margin-top: 8px; font-size: 14px; }
  .avviso ul { margin: 0; padding-left: 18px; }
  .serata { display: block; width: 100%; border: 0; text-align: left; background: var(--card); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; }
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"><p class="empty">Caricamento…</p></main>
<div id="foot"></div>

<script>
// ------------------------------------------------------------ stato
const LS = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const S = {
  operatore: LS.get('operatore'),
  d: null,              // dati dal server
  view: 'login',        // login | menu | noSerata | bar | riepilogo | storico | dettaglio
  bar: LS.get('bar'),   // bar scelto su questo telefono
  fase: 'carico',       // carico | scarico | vendite
  mod: {},              // valori modificati e non salvati: {prodottoId: testo}
  vend: null,           // vendite in modifica: {nDrink, nShot}
  soloCaricati: true,   // in Scarico mostra solo i prodotti con un carico
  storico: null,        // [{serataId, data, righe}]
  dettaglio: null,      // {serata, conteggi, righe}
  dataSerata: '',
  busy: false,
  sync: 'ok',
};

// ------------------------------------------------------------ server
// L'app (GitHub Pages) parla con lo script Google via POST.
const API_URL = 'https://script.google.com/macros/s/AKfycbwwaUX5dQ07QcJSyHY2-x5r2i8KrI52SjVT0h_iOiP9C0RB1XffRqYn7PY34PLgheeXoQ/exec';
const TIMEOUT_MS = 25000;

function api(action, payload) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, payload: payload || {} }),
    signal: ctrl.signal,
  })
    .then(r => {
      if (!r.ok) throw new Error('Errore del server (' + r.status + '): riprova');
      return r.json().catch(() => { throw new Error('Risposta non valida dal server: riprova'); });
    }, e => {
      throw new Error(e && e.name === 'AbortError' ? 'Il server non risponde: riprova' : 'Connessione assente: riprova');
    })
    .then(r => { if (!r.ok) throw new Error(r.error); return r.data; })
    .finally(() => clearTimeout(timer));
}

// Le risposte possono arrivare in disordine: applico solo quelle più recenti dell'ultima applicata.
let seqInviata = 0, seqApplicata = 0, scrittureInCorso = 0;
const LETTURE = ['stato', 'storico', 'dettaglioSerata'];

async function call(action, payload, silent) {
  const seq = ++seqInviata;
  const scrive = LETTURE.indexOf(action) < 0;
  if (scrive) scrittureInCorso++;
  setSync('busy');
  try {
    const d = await api(action, payload);
    // Solo "stato" e le scritture restituiscono lo stato completo
    if ((action === 'stato' || scrive) && seq > seqApplicata) { seqApplicata = seq; S.d = d; }
    setSync('ok');
    return d;
  } catch (e) {
    setSync('off');
    if (!silent) toast(errMsg(e));
    if (/serata non è più aperta/.test(errMsg(e)) && S.d) S.d = Object.assign({}, S.d, { serata: null });
    throw e;
  } finally {
    if (scrive) scrittureInCorso--;
  }
}

function serataOk() {
  if (S.d && S.d.serata) return true;
  toast('La serata è stata chiusa da un altro telefono: dati non salvati');
  render();
  return false;
}

function errMsg(e) {
  const m = (e && e.message) || String(e);
  return m.replace(/^Error:\s*/, '') || 'Errore di connessione';
}

function setSync(s) {
  S.sync = s;
  const el = document.querySelector('.sync');
  if (el) el.className = 'sync ' + s;
}

// ------------------------------------------------------------ utilità
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const vuoto = v => v === undefined || v === null || String(v).trim() === '';
const num = v => Number(String(v === undefined || v === null ? '' : v).replace(',', '.')) || 0;
const fmt = (n, dec) => num(n).toLocaleString('it-IT', { maximumFractionDigits: dec === undefined ? 2 : dec });
const fmtData = iso => { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; };
const oggi = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const tondo = n => Math.round(num(n) * 1000) / 1000;
/** Testo di quantità valido: vuoto oppure numero ≥ 0 con al massimo 2 decimali (virgola o punto). */
const qtaValida = s => vuoto(s) || /^\d+([.,]\d{1,2})?$/.test(String(s).trim());

let toastTimer;
function toast(msg, ok) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); document.body.appendChild(el); }
  el.className = 'toast' + (ok ? ' ok' : '');
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), ok ? 1800 : 4000);
}

const conteggio = (bar, id) => S.d.conteggi.find(r => r.bar === bar && r.prodotto_id === id);
const vendita = bar => S.d.vendite.find(v => v.bar === bar);
const kpiBar = bar => S.d.riepilogo && S.d.riepilogo.bar.find(b => b.bar === bar);

/** Valore salvato sul foglio per il bar corrente e una fase. */
function salvato(id, fase) {
  const r = conteggio(S.bar, id);
  return r && !vuoto(r[fase]) ? String(r[fase]).replace('.', ',') : '';
}

/** Valore mostrato: quello modificato, altrimenti quello salvato. */
function valore(id) {
  return Object.prototype.hasOwnProperty.call(S.mod, id) ? S.mod[id] : salvato(id, S.fase);
}

/** Modifiche vere: diverse da quanto salvato (stesso numero scritto in modo diverso non conta). */
function modifiche() {
  const out = {};
  Object.keys(S.mod).forEach(id => {
    const a = S.mod[id], b = salvato(id, S.fase);
    if (vuoto(a) && vuoto(b)) return;
    if (!vuoto(a) && !vuoto(b) && num(a) === num(b)) return;
    out[id] = String(a).trim();
  });
  return out;
}

function venditeModificate() {
  if (!S.vend) return false;
  const v = vendita(S.bar) || {};
  return num(S.vend.nDrink) !== num(v.n_drink) || num(S.vend.nShot) !== num(v.n_shot);
}

/** Campi "drink venduti" con i valori salvati del bar (solo nella scheda vendite). */
function caricaVendite() {
  const v = S.fase === 'vendite' && vendita(S.bar);
  S.vend = S.fase !== 'vendite' ? null : { nDrink: v ? String(v.n_drink) : '', nShot: v ? String(v.n_shot) : '' };
}

const inSospeso = () => S.view === 'bar' && (Object.keys(modifiche()).length > 0 || venditeModificate());

function lasciaModifiche() {
  if (!inSospeso()) return true;
  if (!confirm('Ci sono modifiche non salvate. Uscire e perderle?')) return false;
  S.mod = {};
  S.vend = null;
  return true;
}

/** Consumo della riga con i valori mostrati (carico e scarico, anche non salvati). */
function consumoMostrato(p) {
  const car = S.fase === 'carico' ? valore(p.id) : salvato(p.id, 'carico');
  const sca = S.fase === 'scarico' ? valore(p.id) : salvato(p.id, 'scarico');
  if (vuoto(car) && vuoto(sca)) return null;
  return tondo(num(car) - num(sca));
}

function testoConsumo(p) {
  const c = consumoMostrato(p);
  if (c === null) return '';
  const litri = p.contaLitri ? ' · ' + fmt(c * p.formato, 2) + ' L' : '';
  return '<span class="' + (c < 0 ? 'neg' : '') + '">consumo ' + fmt(c) + litri + '</span>';
}

const doseHtml = k => {
  if (!k || k.doseCl === null) return '–';
  const oltre = S.d.doseTarget > 0 && k.doseCl > S.d.doseTarget;
  return '<span class="' + (oltre ? 'warn' : 'pos') + '">' + fmt(k.doseCl, 1) + ' cl</span>';
};

const sprecoHtml = n => n === null || n === undefined ? '–'
  : '<span class="' + (n > 0 ? 'warn' : '') + '">' + (n > 0 ? '+' : '') + fmt(n, 0) + '</span>';

// ------------------------------------------------------------ viste
const hdr = (title, back, badge) =>
  (back ? '<button class="back" data-act="' + back + '" aria-label="Indietro">‹</button>' : '') +
  '<h1>' + title + '</h1>' +
  (badge ? '<span class="badge bar">' + esc(badge) + '</span>' : '') +
  '<span class="sync ' + S.sync + '" title="Sincronizzazione"></span>';

const esci = () => `<p class="muted" style="text-align:center;margin-top:24px">Operatore: ${esc(S.operatore)} ·
  <a href="#" data-act="esci" style="color:var(--muted)">esci</a></p>`;

/** Scheda KPI di un bar o del totale. */
function cardKpi(k, titolo) {
  const avvisi = k.avvisi.length ? `<div class="avviso"><ul>${k.avvisi.map(a => '<li>' + esc(a) + '</li>').join('')}</ul></div>` : '';
  return `<div class="card">
    <div class="row"><b>${esc(titolo || k.bar)}</b><span class="muted">${k.prodottiCaricati} prodotti caricati</span></div>
    <div class="kpis">
      <div><div class="muted">Litri</div><div class="kpi">${fmt(k.litri, 2)}</div></div>
      <div><div class="muted">Drink / shot</div><div class="kpi">${k.venditeInserite ? k.nDrink + ' / ' + k.nShot : '–'}</div></div>
      <div><div class="muted">Dose media</div><div class="kpi">${doseHtml(k)}</div></div>
      <div><div class="muted">Bicchieri usati</div><div class="kpi">${fmt(k.bicchieri, 0)}</div></div>
      <div><div class="muted">Spreco bicch.</div><div class="kpi">${sprecoHtml(k.sprecoBicchieri)}</div></div>
      <div><div class="muted">Spreco shot</div><div class="kpi">${sprecoHtml(k.sprecoShot)}</div></div>
    </div>${avvisi}</div>`;
}

/** Tabella consumi per prodotto (righe di Conteggi di un bar). */
function tabellaConsumi(righe) {
  const r = righe.filter(x => !vuoto(x.carico) || !vuoto(x.scarico))
    .sort((a, b) => String(a.prodotto_id).localeCompare(String(b.prodotto_id), 'it', { numeric: true }));
  if (!r.length) return '<p class="muted">Nessun conteggio.</p>';
  return `<table><tr><th>Prodotto</th><th>Car.</th><th>Scar.</th><th>Cons.</th><th>Litri</th></tr>
    ${r.map(x => `<tr>
      <td>${esc(x.prodotto)}</td><td>${vuoto(x.carico) ? '–' : fmt(x.carico)}</td>
      <td>${vuoto(x.scarico) ? '<span class="warn">–</span>' : fmt(x.scarico)}</td>
      <td class="${num(x.consumo) < 0 ? 'neg' : ''}">${fmt(x.consumo)}</td>
      <td>${x.conta_litri === true || /^(true|vero)$/i.test(String(x.conta_litri)) ? fmt(x.consumo_litri, 2) : ''}</td>
    </tr>`).join('')}</table>`;
}

const VIEWS = {
  login() {
    return {
      header: hdr('Carico Scarico Bar'),
      body: `<div class="card">
        <label for="op">Il tuo nome</label>
        <input id="op" value="${esc(S.operatore)}" placeholder="es. Marco" autocomplete="off">
        <button class="btn primary block" style="margin-top:18px" data-act="login">Entra</button>
      </div>`,
    };
  },

  menu() {
    const serata = S.d.serata;
    const voce = b => {
      const k = kpiBar(b);
      const info = k && k.prodottiCaricati
        ? k.prodottiCaricati + ' caricati · ' + (k.prodottiCaricati - k.scarichiMancanti) + ' scaricati · dose ' + doseHtml(k)
        : 'Nessun conteggio';
      return `<button class="menu-card" data-act="apriBar" data-b="${esc(b)}">
        <span class="ico">&#127864;</span>
        <span><span class="t">${esc(b)}</span><br><span class="muted">${info}</span></span>
        <span class="freccia muted">&rsaquo;</span></button>`;
    };
    return {
      header: hdr('Menu'),
      body: `<p class="muted" style="margin-top:0">Ciao ${esc(S.operatore)} · ${serata ? 'Serata ' + fmtData(serata.data) : 'Nessuna serata aperta'}</p>
        ${serata ? S.d.bar.map(voce).join('') + '<button class="btn block" data-act="vai" data-v="riepilogo">Riepilogo serata</button>'
          : '<button class="btn primary block" data-act="vai" data-v="noSerata">Apri serata</button>'}
        <button class="btn block" style="margin-top:10px" data-act="apriStorico">Storico serate</button>
        ${esci()}`,
    };
  },

  noSerata() {
    return {
      header: hdr('Apri serata', 'menu'),
      body: `<div class="card">
        <label for="dataSerata">Data della serata</label>
        <input id="dataSerata" type="date" value="${esc(S.dataSerata || oggi())}">
        <button class="btn primary block" style="margin-top:18px" data-act="apriSerata">Apri serata</button>
      </div>`,
    };
  },

  bar() {
    const tab = (f, t) => `<button class="btn tab${S.fase === f ? ' on' : ''}" data-act="fase" data-f="${f}">${t}</button>`;
    const tabs = `<div class="tabs">${tab('carico', 'Carico')}${tab('scarico', 'Scarico')}${tab('vendite', 'Drink venduti')}</div>`;
    const header = hdr('Serata ' + fmtData(S.d.serata.data), 'menu', S.bar);

    if (S.fase === 'vendite') {
      const v = S.vend || {};
      const k = kpiBar(S.bar);
      return {
        header,
        body: `${tabs}<div class="card">
          <p class="muted" style="margin-top:0">Numeri dalla cassa per ${esc(S.bar)}. Uno shot conta ${fmt(S.d.pesoShot)} drink nella dose media.</p>
          <label for="nDrink">Drink venduti</label>
          <input id="nDrink" data-v="nDrink" inputmode="numeric" value="${esc(v.nDrink)}" autocomplete="off">
          <label for="nShot">Shot venduti</label>
          <input id="nShot" data-v="nShot" inputmode="numeric" value="${esc(v.nShot)}" autocomplete="off">
        </div>${k ? cardKpi(k) : ''}`,
        footer: `<button class="btn primary" data-act="salvaVendite"${S.busy || !venditeModificate() ? ' disabled' : ''}>${S.busy ? 'Salvataggio…' : 'Salva drink venduti'}</button>`,
      };
    }

    const scarico = S.fase === 'scarico';
    let prodotti = S.d.prodotti;
    if (scarico && S.soloCaricati) prodotti = prodotti.filter(p => !vuoto(salvato(p.id, 'carico')) || Object.prototype.hasOwnProperty.call(S.mod, p.id));
    const mod = modifiche();
    let cat = null, html = '';
    prodotti.forEach(p => {
      if (p.categoria !== cat) { cat = p.categoria; html += `<div class="cat">${esc(cat)}</div>`; }
      const hint = scarico
        ? 'carico ' + (vuoto(salvato(p.id, 'carico')) ? '–' : salvato(p.id, 'carico')) + ' · <span data-cons="' + esc(p.id) + '">' + testoConsumo(p) + '</span>'
        : esc(p.unita) + (p.formato ? ' · ' + fmt(p.formato) + ' L' : '');
      html += `<div class="item${mod[p.id] !== undefined ? ' mod' : ''}" data-item="${esc(p.id)}">
        <div class="name"><b>${esc(p.nome)}</b><span class="muted">${hint}</span></div>
        <div class="step">
          <button data-act="piu" data-id="${esc(p.id)}" data-d="-1" aria-label="Meno">−</button>
          <input data-q="${esc(p.id)}" inputmode="decimal" value="${esc(valore(p.id))}" placeholder="–" autocomplete="off">
          <button data-act="piu" data-id="${esc(p.id)}" data-d="1" aria-label="Più">+</button>
        </div></div>`;
    });
    const n = Object.keys(mod).length;
    return {
      header,
      body: `${tabs}
        <p class="muted" style="margin-top:0">${scarico
          ? 'Bottiglie rimaste a fine serata. Le bottiglie aperte in decimi: 0,5 = metà.'
          : 'Bottiglie date al bar a inizio serata. Le bottiglie aperte in decimi: 13,7 = 13 piene + una al 70%.'}</p>
        ${scarico ? `<label class="chk"><input type="checkbox" data-act="soloCaricati"${S.soloCaricati ? ' checked' : ''}> Solo prodotti caricati</label>` : ''}
        ${html || '<p class="empty">Nessun prodotto caricato in questo bar.</p>'}`,
      footer: `<button class="btn primary" data-act="salvaConteggi"${S.busy || !n ? ' disabled' : ''}>${S.busy ? 'Salvataggio…' : n ? 'Salva ' + (scarico ? 'scarico' : 'carico') + ' (' + n + ')' : 'Nessuna modifica'}</button>`,
    };
  },

  riepilogo() {
    const r = S.d.riepilogo;
    const tabelle = S.d.bar.map(b => `<details><summary>Consumi per prodotto · ${esc(b)}</summary>
      ${tabellaConsumi(S.d.conteggi.filter(x => x.bar === b))}</details>`).join('');
    return {
      header: hdr('Riepilogo ' + fmtData(S.d.serata.data), 'menu'),
      body: `${r.bar.map(k => cardKpi(k)).join('')}${cardKpi(r.totale, 'Totale serata')}
        <div class="card">${tabelle}</div>
        <p class="muted">Dose media = litri di spirits e amari / (drink + shot × ${fmt(S.d.pesoShot)}).
          Obiettivo: ${S.d.doseTarget ? fmt(S.d.doseTarget) + ' cl' : 'non impostato'}.
          Spreco = bicchieri usati − drink venduti (positivo = bicchieri in più).</p>
        <button class="btn danger block" style="margin-top:14px" data-act="chiudiSerata">Chiudi serata</button>`,
    };
  },

  storico() {
    const lista = S.storico;
    let body;
    if (!lista) body = '<p class="empty">Caricamento…</p>';
    else if (!lista.length) body = '<p class="empty">Nessuna serata chiusa.</p>';
    else {
      body = lista.map(s => {
        const tot = s.righe.find(r => r.bar === 'TOTALE') || {};
        const bar = s.righe.filter(r => r.bar !== 'TOTALE');
        return `<button class="serata" data-act="apriDettaglio" data-id="${esc(s.serataId)}">
          <div class="row"><b>${fmtData(s.data)}</b><span>${fmt(tot.litri, 2)} L · ${num(tot.n_drink)} drink · ${doseHtml({ doseCl: vuoto(tot.dose_cl) ? null : num(tot.dose_cl) })}</span></div>
          ${bar.map(b => `<div class="row muted"><span>${esc(b.bar)}</span>
            <span>${fmt(b.litri, 2)} L · ${num(b.n_drink)} drink · ${vuoto(b.dose_cl) ? '–' : fmt(b.dose_cl, 1) + ' cl'}${b.avvisi ? ' · <span class="warn">!</span>' : ''}</span></div>`).join('')}
        </button>`;
      }).join('');
    }
    return { header: hdr('Storico serate', 'menu'), body };
  },

  dettaglio() {
    const d = S.dettaglio;
    if (!d.conteggi) return { header: hdr('Serata ' + fmtData(d.data), 'apriStorico'), body: '<p class="empty">Caricamento…</p>' };
    const bars = [];
    d.conteggi.forEach(r => { if (bars.indexOf(r.bar) < 0) bars.push(r.bar); });
    const riga = b => d.righe.find(r => r.bar === b);
    const kpi = r => r ? `<p class="muted">${fmt(r.litri, 2)} L · ${num(r.n_drink)} drink · ${num(r.n_shot)} shot · dose
      ${vuoto(r.dose_cl) ? '–' : fmt(r.dose_cl, 1) + ' cl'} · bicchieri ${fmt(r.bicchieri_usati, 0)} (spreco ${vuoto(r.spreco_bicchieri) ? '–' : fmt(r.spreco_bicchieri, 0)})</p>
      ${r.avvisi ? '<div class="avviso">' + esc(r.avvisi) + '</div>' : ''}` : '';
    return {
      header: hdr('Serata ' + fmtData(d.data), 'apriStorico'),
      body: `${riga('TOTALE') ? '<div class="card"><b>Totale</b>' + kpi(riga('TOTALE')) + '</div>' : ''}
        ${bars.map(b => `<div class="card"><b>${esc(b)}</b>${kpi(riga(b))}${tabellaConsumi(d.conteggi.filter(x => x.bar === b))}</div>`).join('')
          || '<p class="empty">Nessun conteggio in questa serata.</p>'}`,
    };
  },
};

function render() {
  if (['bar', 'riepilogo'].includes(S.view) && !S.d.serata) S.view = 'menu';
  if (S.view === 'noSerata' && S.d.serata) S.view = 'menu';
  if (S.view === 'bar' && S.d.bar.indexOf(S.bar) < 0) S.view = 'menu';
  const v = VIEWS[S.view]();
  $('hdr').innerHTML = v.header;
  $('app').innerHTML = v.body;
  $('foot').innerHTML = v.footer ? '<div class="footer"><div class="inner">' + v.footer + '</div></div>' : '';
}

/** Aggiorna solo pulsante Salva, bordo della riga e consumo, senza ridisegnare (il campo resta attivo). */
function aggiornaRiga(id) {
  const mod = modifiche();
  const item = document.querySelector('[data-item="' + CSS.escape(id) + '"]');
  if (item) item.classList.toggle('mod', mod[id] !== undefined);
  const cons = document.querySelector('[data-cons="' + CSS.escape(id) + '"]');
  const p = S.d.prodotti.find(x => x.id === id);
  if (cons && p) cons.innerHTML = testoConsumo(p);
  aggiornaFooter();
}

function aggiornaFooter() {
  if (S.view !== 'bar') return;
  const v = VIEWS.bar();
  $('foot').innerHTML = '<div class="footer"><div class="inner">' + v.footer + '</div></div>';
}

// ------------------------------------------------------------ azioni
const ACT = {
  async login() {
    S.operatore = $('op').value.trim();
    if (!S.operatore) return toast('Inserisci il tuo nome');
    try { await call('stato'); } catch (e) { return; }
    LS.set('operatore', S.operatore);
    S.view = 'menu';
    render();
  },
  esci() {
    if (!lasciaModifiche()) return;
    S.view = 'login';
    render();
  },
  menu() {
    if (!lasciaModifiche()) return;
    S.view = 'menu';
    render();
    window.scrollTo(0, 0);
  },
  vai(ds) { S.view = ds.v; render(); window.scrollTo(0, 0); },

  async apriSerata() {
    try { await call('apriSerata', { data: $('dataSerata').value }); } catch (e) { return; }
    S.dataSerata = '';
    S.view = 'menu';
    render();
  },
  async chiudiSerata() {
    if (!serataOk()) return;
    const avvisi = S.d.riepilogo.bar.reduce((n, b) => n + b.avvisi.length, 0);
    if (!confirm('Chiudere la serata?' + (avvisi ? '\n\nCi sono ' + avvisi + ' avvisi nel riepilogo.' : '') +
      '\n\nI totali vanno nello storico e non si potranno più modificare carichi e scarichi dall\'app.')) return;
    try { await call('chiudiSerata', { serataId: S.d.serata.id }); } catch (e) { return; }
    toast('Serata chiusa e salvata', true);
    S.view = 'menu';
    render();
  },

  apriBar(ds) {
    S.bar = ds.b;
    LS.set('bar', S.bar);
    S.mod = {};
    caricaVendite();
    S.view = 'bar';
    render();
    window.scrollTo(0, 0);
  },
  fase(ds) {
    if (ds.f === S.fase || !lasciaModifiche()) return;
    S.fase = ds.f;
    S.mod = {};
    caricaVendite();
    render();
    window.scrollTo(0, 0);
  },
  soloCaricati() { S.soloCaricati = !S.soloCaricati; render(); },
  piu(ds) {
    const cur = valore(ds.id);
    if (!qtaValida(cur)) return toast('Quantità non valida');
    S.mod[ds.id] = vuoto(cur) && Number(ds.d) < 0 ? '' : String(tondo(Math.max(0, num(cur) + Number(ds.d)))).replace('.', ',');
    const el = document.querySelector('[data-q="' + CSS.escape(ds.id) + '"]');
    if (el) el.value = S.mod[ds.id];
    aggiornaRiga(ds.id);
  },
  async salvaConteggi() {
    const valori = modifiche();
    const errati = Object.keys(valori).filter(id => !qtaValida(valori[id]));
    if (errati.length) {
      const p = S.d.prodotti.find(x => x.id === errati[0]);
      return toast('Quantità non valida: ' + (p ? p.nome : errati[0]));
    }
    if (!Object.keys(valori).length || !serataOk()) return;
    const fase = S.fase;
    S.busy = true;
    aggiornaFooter();
    try {
      await call('salvaConteggi', { serataId: S.d.serata.id, bar: S.bar, fase, valori, operatore: S.operatore });
    } catch (e) {
      S.busy = false;
      aggiornaFooter();
      return;
    }
    S.busy = false;
    S.mod = {};
    toast((fase === 'scarico' ? 'Scarico' : 'Carico') + ' salvato', true);
    render();
  },
  async salvaVendite() {
    const v = S.vend;
    for (const k of ['nDrink', 'nShot']) {
      if (!vuoto(v[k]) && !/^\d+$/.test(String(v[k]).trim())) return toast('Inserisci numeri interi');
    }
    if (!serataOk()) return;
    S.busy = true;
    aggiornaFooter();
    try {
      await call('salvaVendite', { serataId: S.d.serata.id, bar: S.bar, nDrink: v.nDrink, nShot: v.nShot, operatore: S.operatore });
    } catch (e) {
      S.busy = false;
      aggiornaFooter();
      return;
    }
    S.busy = false;
    caricaVendite();
    toast('Drink venduti salvati', true);
    render();
  },

  async apriStorico() {
    S.storico = null;
    S.view = 'storico';
    render();
    window.scrollTo(0, 0);
    try { S.storico = await call('storico', { limite: 60 }); } catch (e) { S.storico = []; }
    if (S.view === 'storico') render();
  },
  async apriDettaglio(ds) {
    const s = (S.storico || []).find(x => x.serataId === ds.id);
    S.dettaglio = { data: s ? s.data : '', righe: s ? s.righe : [], conteggi: null };
    S.view = 'dettaglio';
    render();
    window.scrollTo(0, 0);
    let d;
    try { d = await call('dettaglioSerata', { serataId: ds.id }); } catch (e) { S.view = 'storico'; render(); return; }
    S.dettaglio.conteggi = d.conteggi;
    if (S.view === 'dettaglio') render();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.type !== 'checkbox') e.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el);
});

document.addEventListener('input', e => {
  const ds = e.target.dataset;
  if (ds.q !== undefined) {
    S.mod[ds.q] = e.target.value;
    aggiornaRiga(ds.q);
  }
  if (ds.v && S.vend) {
    S.vend[ds.v] = e.target.value;
    aggiornaFooter();
  }
  if (e.target.id === 'dataSerata') S.dataSerata = e.target.value;
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'op') ACT.login();
  // Invio su un campo quantità passa al prodotto successivo
  if (e.target.dataset.q !== undefined) {
    const campi = Array.from(document.querySelectorAll('[data-q]'));
    const i = campi.indexOf(e.target);
    if (campi[i + 1]) { e.preventDefault(); campi[i + 1].focus(); campi[i + 1].select(); }
  }
});

// Avviso se si chiude la pagina con modifiche non salvate
window.addEventListener('beforeunload', e => { if (inSospeso()) { e.preventDefault(); e.returnValue = ''; } });

// ------------------------------------------------------------ sincronizzazione
let pollInCorso = false, ultimoDisegnato = '';

async function aggiorna() {
  if (['login', 'storico', 'dettaglio'].includes(S.view) || S.busy || scrittureInCorso || pollInCorso) return;
  pollInCorso = true;
  let d;
  try { d = await call('stato', null, true); } catch (e) { return; } finally { pollInCorso = false; }
  if (d !== S.d) return;  // risposta superata da una più recente
  const typing = (document.activeElement || {}).tagName === 'INPUT';
  // Con modifiche in sospeso o mentre si scrive non ridisegno: i dati arrivano comunque.
  if (inSospeso() || typing) return;
  const firma = JSON.stringify(S.d);
  if (firma === ultimoDisegnato) return;
  ultimoDisegnato = firma;
  render();
}

setInterval(() => { if (!document.hidden) aggiorna(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) aggiorna(); });

// ------------------------------------------------------------ avvio
(async function start() {
  if (S.operatore) {
    try {
      await call('stato', null, true);
      S.view = 'menu';
    } catch (e) {
      S.view = 'login';
    }
  }
  render();
})();
</script>
</body>
</html>
